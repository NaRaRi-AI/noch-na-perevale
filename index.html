<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Одна ночь на перевале — Психологический триллер</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020408;
            color: #cbd5e1;
        }

        h1, h2, h3, .font-mono-title {
            font-family: 'Special Elite', monospace;
        }

        .glow-box {
            box-shadow: 0 0 40px rgba(14, 165, 233, 0.05);
            border: 1px solid rgba(14, 165, 233, 0.12);
        }

        .glow-button:hover {
            box-shadow: 0 0 25px rgba(14, 165, 233, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-950 via-[#020408] to-black">

    <!-- Шапка -->
    <header class="w-full py-5 px-4 text-center border-b border-sky-950/60 bg-black/80 backdrop-blur-md">
        <span class="text-xs text-sky-500/70 tracking-widest uppercase font-semibold block mb-1">Следственное дело № 84-П / Грифом «Бессрочно»</span>
        <h1 class="text-xl sm:text-2xl font-bold tracking-wider text-sky-400 font-mono-title drop-shadow-[0_0_12px_rgba(14,165,233,0.3)]">
            Одна ночь на перевале
        </h1>
    </header>

    <!-- Основной контейнер игры -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-6">
        <div id="game-container" class="w-full max-w-xl bg-slate-900/95 backdrop-blur-xl rounded-xl p-6 sm:p-8 glow-box transition-all duration-300">
            <!-- Динамический контент -->
        </div>
    </main>

    <!-- Подвал -->
    <footer class="w-full py-3 text-center text-xs text-slate-600 border-t border-slate-900/80">
        Ураганный ветер стирает следы быстрее, чем они появляются на насте
    </footer>

    <script>
        const storyData = {
            intro: {
                title: "Глава I: Последний приют у кедра",
                text: "Ветер бьет в брезент палатки с такой безумной яростью, будто массивные стены горы М. задались целью стереть вас с лица земли. Температура за бортом рухнула далеко за минус тридцать пять. Внутри тесно, душно от паров дыхания и запаха мокрой шерсти. Внезапно сквозь гул бури прорезается низкий, нарастающий инфразвуковой гул. От него закладывает уши, а в груди вспыхивает липкая, животная паника. Секунду спустя брезент снаружи заливает ослепительная, неестественно-синяя вспышка.",
                choices: [
                    { text: "Срочно кромсать ножом брезент изнутри и вываливаться в метель", next: "tent_cut_1" },
                    { text: "Попытаться включить фонарь и привести товарищей в чувство", next: "tent_calm_1" }
                ]
            },
            tent_calm_1: {
                title: "Глава I: Ледяные лица",
                text: "Щелчок тумблера тонет в грохоте бури. Фонарь мертв, хотя батареи вставлялись новыми. Наощупь лица товарищей кажутся ледяными валунами. На прямой оклик они не отвечают — лишь глухо, ритмично бормочут что-то на незнакомом гортанном диалекте. Снаружи раздается металлический скрежет, будто кто-то когтями сдирает наледь с металла.",
                choices: [
                    { text: "Хватит ждать. Рвать палатку и бежать наощупь в темноту", next: "tent_cut_1" },
                    { text: "Шарить в темноте в поисках аптечки и сигнального патрона", next: "tent_flare" }
                ]
            },
            tent_flare: {
                title: "Глава I: Вспышка в метели",
                text: "Пальцы нащупывают тубус сигнального патрона. Сорвав колпачок, вы дергаете шнур. Ослепительно-красный свет выхватывает из темноты перекошенные ужасом лица товарищей и... огромный силуэт, заглядывающий внутрь сквозь проран в брезенте. Существо без лица, сотканное из мерцающего холода. Палатка с треском рвется сама.",
                choices: [
                    { text: "Выбрасываться наружу через провал в заснеженный склон", next: "tent_cut_1" }
                ]
            },
            tent_cut_1: {
                title: "Глава II: Бегство в слепую мглу",
                text: "Вы вываливаетесь из распоротой палатки прямо в лицо ревущей стихии. Босые ноги мгновенно каменеют на жестком ветровом насте. В ста метрах ниже по склону, у рафинированного силуэта старого кедра, пульсирует чужеродный синий свет. Воздух гудит от статического электричества, во рту чувствуется отчетливый вкус медных монет.",
                choices: [
                    { text: "Броситься вниз по крутому склону прямо к сиянию у кедра", next: "cedar_approach" },
                    { text: "Уходить в сторону от гребня, в кромешную тьму каменного хаоса", next: "rocks_escape" }
                ]
            },
            rocks_escape: {
                title: "Глава II: Каменный лабиринт",
                text: "Вы карабкаетесь между занесенными снегом валунами, обдирая пальцы до крови. Метель здесь воет иначе — будто шепчет чужие имена на выдохе. Впереди мелькает слабый желтый огонек. Возможно, это чудом уцелевший лагерь другой группы? Или это заманивающая в ловушку иллюзия?",
                choices: [
                    { text: "Изо всех сил пробиваться к чужому желтому огоньку", next: "yellow_light" },
                    { text: "Забиться в узкую расщелину между скалами и переждать бурю", next: "crevice_hide" }
                ]
            },
            crevice_hide: {
                title: "Глава III: Укрытие под настом",
                text: "Вы втискиваетесь в ледяной каменный мешок. Ветер здесь дует слабее, но мороз пробирает до костей, превращая кровь в лед. Снаружи, прямо над расщелиной, раздается тяжелая поступь. Кто-то или что-то шагает по каменным плитам с нечеловеческой уверенностью. Тень заглядывает внутрь расщелины — два пустых белых провала вместо глаз.",
                choices: [
                    { text: "Замереть, стараясь даже не дышать, в надежде на чудо", next: "crevice_survive" },
                    { text: "Резко выскочить из укрытия и карабкаться на гребень", next: "ending_cliff" }
                ]
            },
            crevice_survive: {
                title: "Глава IV: Утро над бездной",
                text: "Несколько часов вы провели на грани безумия и потери сознания. К рассвету буря утихла, оставив после себя мертвенно-белую пустыню. Вы выносите из укрытия обмороженные руки. Внизу, у кедра, чернеет разорванная палатка и странные оплавленные воронки. Вы один на всем перевале.",
                choices: [
                    { text: "Начать тяжелый спуск вниз по долине реки в надежде выйти к людям", next: "ending_survivor" },
                    { text: "Подняться к остаткам палатки, чтобы найти дневник и вещи", next: "ending_diary" }
                ]
            },
            yellow_light: {
                title: "Глава III: Иллюзия тепла",
                text: "Вы продираетесь через сугровы к желтому свету, но чем ближе подходите, тем отчетливее понимаете: это не костер. Это свечение исходит из трещин в самом льду, пульсируя в такт вашему собственному испуганному пульсу. Из-за валуна доносится шепот, зовущий вас по имени.",
                choices: [
                    { text: "Ответить на зов и сделать шаг навстречу сиянию во льду", next: "ending_ice_absorb" },
                    { text: "Развернуться и бежать прочь к старому кедру", next: "cedar_approach" }
                ]
            },
            cedar_approach: {
                title: "Глава III: Уголевы тропы",
                text: "Вы падаете в снег у подножия кедра. Вокруг дерева снег не просто растоплен — он спекся в зеркальное стекло, отражающее ночное небо без единой звезды. В центре площадки лежит оброненный кем-то фотоаппарат с сорванным объективом и следы босых ног, уходящие вертикально в отвесную скалу.",
                choices: [
                    { text: "Поднять фотоаппарат и заглянуть в треснувший видоискатель", next: "ending_camera" },
                    { text: "Попытаться идти по следам босых ног наверх", next: "ending_ascension" }
                ]
            },
            ravine_hide: {
                title: "Глава III: Глубокий лог",
                text: "Скатившись в глубокий овраг, вы забиваетесь под снежный козырек. Вверху проплывают тени — они движутся слишком плавно и неестественно быстро для людей. Одна из теней замирает прямо над вашим укрытием, излучая невыносимый могильный холод.",
                choices: [
                    { text: "Закрыть глаза и приготовиться к худшему", next: "ending_silence" },
                    { text: "Резко вскочить и бежать вниз по руслу замерзшего ручья", next: "ending_stream" }
                ]
            },
            // Концовки
            ending_anomaly: {
                title: "Финал: Точка невозврата",
                isEnding: true,
                text: "Прикосновение к обожженной коре кедра отзывается взрывом в сознании. Вы видите геометрию невидимых сил. Месяц спустя поисковики найдут тело без признаков насильственной смерти, но с совершенно седыми волосами. Дело закроют с формулировкой «неустановленная стихийная сила».",
                endingTitle: "Финал: Пленники сороковой параллели",
                endingDesc: "Гора забрала ваше имя, оставив лишь пустую оболочку во льдах.",
                shareText: "Я разгадал тайну синего света у кедра в триллере «Одна ночь на перевале»!"
            },
            ending_frozen: {
                title: "Финал: Ледяной саван",
                isEnding: true,
                text: "Попытка вернуться к палатке закончилась на полпути. Силы окончательно оставили вас. Метель бережно укутала неподвижное тело, превратив в еще один памятник человеческому безумию на склоне.",
                endingTitle: "Финал: Вечный сон на насте",
                endingDesc: "Вы стали частью холодного пейзажа. Дороги назад больше нет.",
                shareText: "Я замерз на склоне горы М. в жутком квесте «Одна ночь на перевале»!"
            },
            ending_silence: {
                title: "Финал: Выживший в тишине",
                isEnding: true,
                text: "Тень ушла, а вы чудом дождались рассвета и вышли к людям. Но холод так и остался внутри вас. Вы вернулись в город другим человеком, который больше никогда не выключает свет по ночам и вздрагивает от любого шороха.",
                endingTitle: "Финал: Расколотый разум",
                endingDesc: "Вы вынесли тело из тайги, но душа навсегда осталась на перевале.",
                shareText: "Я пережил ночь на перевале, но унес страшную тайну с собой!"
            },
            ending_stream: {
                title: "Финал: Погоня в логу",
                isEnding: true,
                text: "Бегство по ручью не спасло от преследования. Шаги за спиной настигли вас на открытом участке. На рассвете найдут лишь разорванную штормовку. Перевал хранит свои секреты надежнее любых сейфов.",
                endingTitle: "Финал: Исчезновение без следов",
                endingDesc: "От вашего пребывания в горах не осталось даже следов на снегу.",
                shareText: "Я попытался убежать от кошмара в квесте «Одна ночь на перевале»!"
            },
            ending_survivor: {
                title: "Финал: Дорога сквозь бурю",
                isEnding: true,
                text: "Спустя трое суток изнурительного пути по пояс в снегу вас подобрали геологи. Обморожения, галлюцинации, потеря памяти. Вы единственный, кто вышел живым из этой роковой ночи, но архивы КГБ навсегда засекретят историю вашей группы.",
                endingTitle: "Финал: Единственный свидетель",
                endingDesc: "Вы выжили, но правда о перевале умрет вместе с вами.",
                shareText: "Я прошел сквозь ад и выжил в триллере «Одна ночь на перевале»!"
            },
            ending_diary: {
                title: "Финал: Последняя запись",
                isEnding: true,
                text: "Вернувшись к палатке за вещами, вы обнаружили чужой дневник со страницей, исписанной вашей собственной рукой — записи сделаны о событиях, которые произойдут только завтра. Осознав ловушку времени, вы замерзаете с улыбкой на устах.",
                endingTitle: "Финал: Петля времени",
                endingDesc: "Прошлое, настоящее и будущее на перевале слились в единый ледяной узел.",
                shareText: "Я попал в временную петлю в квесте «Одна ночь на перевале»!"
            },
            ending_ice_absorb: {
                title: "Финал: Растворение во льду",
                isEnding: true,
                text: "Шагнув в ледяное свечение, вы не почувствовали боли. Только бесконечный, звенящий покой. Теперь вы — часть холодного сияния, наблюдающая за новыми туристами, поднимающимися на роковой склон.",
                endingTitle: "Финал: Новый страж горы",
                endingDesc: "Вы больше не человек. Вы — часть легенды перевала.",
                shareText: "Я стал частью тайны горы М. в квесте «Одна ночь на перевале»!"
            },
            ending_camera: {
                title: "Финал: Последний кадр",
                isEnding: true,
                text: "В объективе фотоаппарата вместо заснеженных гор отражалось нечто колоссальное, зависшее прямо над палаткой. Вспышка памяти оборвала вашу жизнь в ту же секунду. Проявившаяся пленка десятилетиями будет волновать умы исследователей.",
                endingTitle: "Финал: Кадр из зазеркалья",
                endingDesc: "Вы увидели то, что человеческий глаз видеть не должен.",
                shareText: "Я заглянул в объектив ужаса в квесте «Одна ночь на перевале»!"
            },
            ending_ascension: {
                title: "Финал: Шаг в белизну",
                isEnding: true,
                text: "Вы пошли босиком по вертикальной ледяной стене, куда звали невидимые следы. Гравитация перестала существовать. Наверху ждал только ослепительный, выжигающий сетчатку свет и абсолютная тишина.",
                endingTitle: "Финал: Вознесение в метель",
                endingDesc: "Ваш путь оборвался там, где кончается земля и начинается космос.",
                shareText: "Я ушел по следам в небо в квесте «Одна ночь на перевале»!"
            },
            ending_cliff: {
                title: "Финал: Обрыв в никуда",
                isEnding: true,
                text: "Рванувшись из расщелины в панике, вы оступились на невидимом карнизе. Секунды свободного падения в густую метельную черноту — и больше ничего, кроме эха вашего крика над ущельем.",
                endingTitle: "Финал: Полет в бездну",
                endingDesc: "Гора не прощает суеты и опрометчивых решений.",
                shareText: "Я сорвался в бездну в мистическом триллере «Одна ночь на перевале»!"
            }
        };

        let currentState = 'intro';

        function renderGame() {
            const container = document.getElementById('game-container');
            const data = storyData[currentState];

            let html = `<div class="fade-in">`;

            if (data.isEnding) {
                html += `
                    <div class="text-center">
                        <span class="inline-block px-3 py-1 mb-4 text-xs font-semibold tracking-wider text-sky-400 uppercase bg-sky-950/80 border border-sky-800/60 rounded-full">Архивное дело закрыто</span>
                        <h2 class="text-xl sm:text-2xl font-bold text-sky-300 mb-3 font-mono-title">${data.endingTitle}</h2>
                        <p class="text-slate-300 text-sm sm:text-base mb-6 leading-relaxed">${data.text}</p>
                        <div class="bg-black/60 p-4 rounded-lg border border-slate-800 mb-8">
                            <p class="text-sky-200/80 text-sm italic">${data.endingDesc}</p>
                        </div>
                        <div class="flex flex-col sm:flex-row gap-3 justify-center">
                            <button onclick="restartGame()" class="px-6 py-3 bg-sky-600 hover:bg-sky-500 text-slate-950 font-bold rounded-lg transition-all glow-button uppercase tracking-wider text-xs">
                                Начать заново
                            </button>
                            <button onclick="shareResult('${data.shareText}')" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-sky-300 font-semibold rounded-lg transition-all border border-sky-500/30 text-xs">
                                Поделиться результатом
                            </button>
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <h2 class="text-lg sm:text-xl font-bold text-sky-400 mb-4 font-mono-title">${data.title}</h2>
                    <p class="text-slate-300 text-sm sm:text-base mb-8 leading-relaxed">${data.text}</p>
                    <div class="space-y-3">
                `;

                data.choices.forEach(choice => {
                    html += `
                        <button onclick="makeChoice('${choice.next}')" class="w-full text-left p-4 rounded-lg bg-slate-800/80 hover:bg-sky-950/50 border border-slate-700/80 hover:border-sky-600/60 transition-all text-slate-200 hover:text-sky-200 text-sm sm:text-base flex items-center justify-between group">
                            <span>${choice.text}</span>
                            <span class="text-sky-400 opacity-0 group-hover:opacity-100 transition-opacity ml-2">→</span>
                        </button>
                    `;
                });

                html += `</div>`;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        function makeChoice(nextNode) {
            currentState = nextNode;
            renderGame();
        }

        function restartGame() {
            currentState = 'intro';
            renderGame();
        }

        function shareResult(text) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    alert("Результат скопирован в буфер обмена!");
                });
            } else {
                alert(text);
            }
        }

        renderGame();
    </script>
</body>
</html>

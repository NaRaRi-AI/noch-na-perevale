<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Одна ночь на перевале — Мистический триллер</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #06080d;
            color: #d1d5db;
        }

        h1, h2, h3, .font-mono-title {
            font-family: 'Special Elite', monospace;
        }

        .glow-box {
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .glow-button:hover {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-950 via-[#06080d] to-black">

    <!-- Шапка -->
    <header class="w-full py-6 px-4 text-center border-b border-cyan-950 bg-black/60 backdrop-blur-md">
        <span class="text-xs text-cyan-500/80 tracking-widest uppercase font-semibold block mb-1">Зона отчуждения / Секретный архив</span>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-wider text-cyan-400 font-mono-title drop-shadow-[0_0_10px_rgba(6,182,212,0.3)]">
            Одна ночь на перевале
        </h1>
    </header>

    <!-- Основной контейнер игры -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-6">
        <div id="game-container" class="w-full max-w-xl bg-slate-900/90 backdrop-blur-xl rounded-xl p-6 sm:p-8 glow-box transition-all duration-300">
            <!-- Динамический контент -->
        </div>
    </main>

    <!-- Подвал -->
    <footer class="w-full py-4 text-center text-xs text-slate-600 border-t border-slate-900">
        Холод, тишина и то, что скрывалось в темноте
    </footer>

    <script>
        const storyData = {
            intro: {
                title: "Шторм у кедра",
                text: "Ветер бьет в брезент палатки с такой силой, будто хочет сорвать ее со склона горы М. Температура стремительно падает. Вдруг сквозь вой метели до слуха доносится странный низкий гул, от которого леденеет кровь. В темноте за стеной палатки мелькает резкая вспышка неестественного синеватого света.",
                choices: [
                    { text: "Срочно резать брезент изнутри ножом и выбегать наружу в снежную бурю", next: "tent_cut" },
                    { text: "Попытаться зажечь фонарь и быстро проверить рюкзаки товарищей", next: "tent_investigate" }
                ]
            },
            tent_investigate: {
                title: "Тревожная находка",
                text: "Вспышка осветила палатку изнутри. Фонарь не включается — батареи сели за секунду, хотя были новыми. Наощупь вы проверяете вещи: фотоаппарат, дневники и теплые куртки брошены. Товарищи дышат тяжело, их лица бледны в темноте, а сами они будто не слышат ваших слов.",
                choices: [
                    { text: "Хватать нож и немедленно прорезать палатку, чтобы бежать наружу", next: "tent_cut" },
                    { text: "Пытаться силой разбудить товарищей и собрать вещи", next: "tent_delay" }
                ]
            },
            tent_delay: {
                title: "Опоздание на мгновение",
                text: "Попытка привести друзей в чувство отняла драгоценные минуты. Гул снаружи стал оглушающим, а ткань палатки начала стремительно плавиться изнутри без видимого огня, выделяя едкий химический запах.",
                choices: [
                    { text: "Бросить вещи и панически вырываться наружу через проплавленный брезент", next: "tent_cut" }
                ]
            },
            tent_cut: {
                title: "Снежная слепота",
                text: "Вы вываливаетесь босиком на ледяной наст. Метель мгновенно забивает дыхание. В ста метрах ниже по склону, у раскидистого кедра, отчетливо видятся странные светящиеся силуэты и пульсирующий шар холодного света, зависший над землей.",
                choices: [
                    { text: "Бежать к кедру сквозь ураган, пытаясь понять, что это за свет", next: "cedar_light" },
                    { text: "Уходить в сторону от гребня, вниз к руслу ручья в поисках укрытия", next: "stream_run" }
                ]
            },
            cedar_light: {
                title: "У темного дерева",
                text: "Добравшись до кедра, вы не находите людей. Только обломанные ветки, странные оплавленные следы на глубоком снегу и необъяснимый жгучий холод, который прожигает кожу сквозь одежду. Воздух пахнет озоном и паленым железом.",
                isEnding: true,
                endingTitle: "Финал: Свет над безымянной высотой",
                endingDesc: "Вы заглянули за грань того, что позволено видеть человеку в горах. Обратной дороги в прежний мир больше нет.",
                shareText: "Я расследовал тайну огней у кедра в мистическом квесте «Одна ночь на перевале»!"
            },
            stream_run: {
                title: "Овраг в темноте",
                text: "Вы успели спуститься в устье ручья и укрыться под глубоким снежным навесом. Метель воет наверху, отрезая путь назад. До рассвета еще долгие часы, а внизу, среди торосов, кто-то тяжело и размеренно шагает по насту.",
                isEnding: true,
                endingTitle: "Финал: Долготочие в ночи",
                endingDesc: "Вы выжили в первые часы ледяного кошмара, но гора забрала ваш покой навсегда.",
                shareText: "Я скрылся в овраге от ледяной тайны в квесте «Одна ночь на перевале»!"
            }
        };

        let currentState = 'intro';

        function renderGame() {
            const container = document.getElementById('game-container');
            const data = storyData[currentState];

            let html = `<div class="fade-in">`;

            if (data.isEnding) {
                html += `
                    <div class="text-center">
                        <span class="inline-block px-3 py-1 mb-4 text-xs font-semibold tracking-wider text-cyan-400 uppercase bg-cyan-950/80 border border-cyan-800/60 rounded-full">Архивная запись закрыта</span>
                        <h2 class="text-2xl sm:text-3xl font-bold text-cyan-300 mb-3 font-mono-title">${data.endingTitle}</h2>
                        <p class="text-slate-300 text-sm sm:text-base mb-6 leading-relaxed">${data.text}</p>
                        <div class="bg-black/50 p-4 rounded-lg border border-slate-800 mb-8">
                            <p class="text-cyan-200/80 text-sm italic">${data.endingDesc}</p>
                        </div>
                        <div class="flex flex-col sm:flex-row gap-3 justify-center">
                            <button onclick="restartGame()" class="px-6 py-3 bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold rounded-lg transition-all glow-button uppercase tracking-wider text-xs">
                                Начать заново
                            </button>
                            <button onclick="shareResult('${data.shareText}')" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-cyan-300 font-semibold rounded-lg transition-all border border-cyan-500/30 text-xs">
                                Поделиться записью
                            </button>
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <h2 class="text-xl sm:text-2xl font-bold text-cyan-400 mb-4 font-mono-title">${data.title}</h2>
                    <p class="text-slate-300 text-sm sm:text-base mb-8 leading-relaxed">${data.text}</p>
                    <div class="space-y-3">
                `;

                data.choices.forEach(choice => {
                    html += `
                        <button onclick="makeChoice('${choice.next}')" class="w-full text-left p-4 rounded-lg bg-slate-800/80 hover:bg-cyan-950/50 border border-slate-700/80 hover:border-cyan-600/60 transition-all text-slate-200 hover:text-cyan-200 text-sm sm:text-base flex items-center justify-between group">
                            <span>${choice.text}</span>
                            <span class="text-cyan-400 opacity-0 group-hover:opacity-100 transition-opacity ml-2">→</span>
                        </button>
                    `;
                });

                html += `</div>`;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        function makeChoice(nextNode) {
            currentState = nextNode;
            renderGame();
        }

        function restartGame() {
            currentState = 'intro';
            renderGame();
        }

        function shareResult(text) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    alert("Запись скопирована! Можно вставлять в Telegram-канал.");
                });
            } else {
                alert(text);
            }
        }

        renderGame();
    </script>
</body>
</html>

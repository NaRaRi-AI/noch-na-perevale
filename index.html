<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Одна ночь на перевале — Психологический триллер</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #000;
            color: #00ff66; /* Ядовито-зеленый основной текст */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.5s ease-in-out;
        }

        h1, h2, h3, .font-mono-title {
            font-family: 'Special Elite', monospace;
            color: #ff0033; /* Кроваво-красные заголовки */
            text-shadow: 0 0 12px rgba(255, 0, 51, 0.8);
        }

        .glow-box {
            background-color: transparent;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 0, 51, 0.4);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
        }

        .glow-button:hover {
            box-shadow: 0 0 25px rgba(255, 0, 51, 0.6);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body id="page-body" class="min-h-screen flex flex-col justify-between">

    <!-- Шапка -->
    <header class="w-full py-5 px-4 text-center border-b border-red-950/60 bg-black/60 backdrop-blur-sm">
        <span class="text-xs text-red-500 tracking-widest uppercase font-semibold block mb-1">Следственное дело № 84-П / Грифом «Бессрочно»</span>
        <h1 class="text-xl sm:text-2xl font-bold tracking-wider text-red-600 font-mono-title drop-shadow-[0_0_12px_rgba(255,0,51,0.6)]">
            Одна ночь на перевале
        </h1>
    </header>

    <!-- Основной контейнер игры -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-6">
        <div id="game-container" class="w-full max-w-xl rounded-xl p-6 sm:p-8 glow-box transition-all duration-300">
            <!-- Динамический контент -->
        </div>
    </main>

    <!-- Подвал -->
    <footer class="w-full py-3 text-center text-xs text-emerald-500/80 border-t border-red-950/60 bg-black/60 backdrop-blur-sm">
        Ураганный ветер стирает следы быстрее, чем они появляются на насте
    </footer>

    <script>
        // Скрытый инвентарь игрока
        let inventory = [];

        const storyData = {
            intro: {
                title: "Глава I: Последний приют у кедра",
                text: "Ветер бьет в брезент палатки с такой безумной яростью, будто массивные стены горы М. задались целью стереть вас с лица земли. Температура за бортом рухнула далеко за минус тридцать пять. Внутри тесно, душно от паров дыхания и запаха мокрой шерсти. Внезапно сквозь гул бури прорезается низкий, нарастающий инфразвуковой гул. От него закладывает уши, а в груди вспыхивает липкая, животная паника. Секунду спустя брезент снаружи заливает ослепительная, неестественно-синяя вспышка.",
                bg: "intro_bg.jpg",
                choices: [
                    { text: "Схватить со стола сигнальный патрон и вырезать выход ножом", action: "take_flare_knife", next: "tent_cut_1" },
                    { text: "Торопливо засунуть за пазуху тяжелый охотничий нож и рвать брезент", action: "take_knife", next: "tent_cut_1" },
                    { text: "Пытаться в темноте нащупать аптечку и привести товарищей в чувство", action: "take_medkit", next: "tent_calm_1" }
                ]
            },
            tent_calm_1: {
                title: "Глава I: Ледяные лица",
                text: "Щелчок тумблера тонет в грохоте бури. Фонарь мертв, хотя батареи вставлялись новыми. Наощупь лица товарищей кажутся ледяными валунами. На прямой оклик они не отвечают — лишь глухо, ритмично бормочут что-то на незнакомом гортанном диалекте. Снаружи раздается металлический скрежет.",
                bg: "intro_bg.jpg",
                choices: [
                    { text: "Хватит ждать. Рвать палатку руками и бежать во тьму", next: "tent_cut_1" },
                    { text: "Использовать аптечку, чтобы вколоть стимулятор кому-то из замерзающих", condition: "medkit", next: "tent_revive" }
                ]
            },
            tent_revive: {
                title: "Глава I: Оживление в морозе",
                text: "Укол стимулятора заставляет одного из товарищей резко распахнуть глаза. Он не кричит — он смотрит сквозь вас в пустой угол и хрипит: «Оно идет по наши души... беги к кедру». После этого его тело каменеет окончательно. Но вы узнаете секрет тропы.",
                bg: "intro_bg.jpg",
                choices: [
                    { text: "Выбраться наружу в метель", next: "tent_cut_1" }
                ]
            },
            tent_flare: {
                title: "Глава I: Вспышка в метели",
                text: "Пальцы нащупывают тубус сигнального патрона. Сорвав колпачок, вы дергаете шнур. Ослепительно-красный свет выхватывает из темноты перекошенные ужасом лица и... огромный силуэт, заглядывающий внутрь сквозь проран. Палатка с треском рвется сама.",
                bg: "tent_cut_bg.jpg",
                choices: [
                    { text: "Выбрасываться наружу через провал в заснеженный склон", next: "tent_cut_1" }
                ]
            },
            tent_cut_1: {
                title: "Глава II: Бегство в слепую мглу",
                text: "Вы вываливаетесь из распоротой палатки прямо в лицо ревущей стихии. Босые ноги мгновенно каменеют на жестком ветровом насте. В ста метрах ниже по склону, у силуэта старого кедра, пульсирует чужеродный синий свет.",
                bg: "tracks_bg.jpg",
                choices: [
                    { text: "Броситься вниз по крутому склону прямо к сиянию у кедра", next: "cedar_approach" },
                    { text: "Уходить в сторону от гребня в каменный хаос", next: "rocks_escape" },
                    { text: "Зажечь сигнальный патрон, чтобы отогнать то, что следит поблизости", condition: "flare", next: "flare_path" }
                ]
            },
            flare_path: {
                title: "Глава II: Кровавый маяк",
                text: "Алый факел вырывает из тьмы движущиеся тени. Они шипят, отступая от света, и открывают безопасный проход между скалами прямо к древнему кедру, минуя ловушки насте.",
                bg: "tracks_bg.jpg",
                choices: [
                    { text: "Уверенно шагнуть к сиянию у кедра", next: "cedar_approach" }
                ]
            },
            rocks_escape: {
                title: "Глава II: Каменный лабиринт",
                text: "Вы карабкаетесь между занесенными снегом валунами, обдирая пальцы до крови. Впереди мелькает слабый желтый огонек. Возможно, это уцелевший лагерь другой группы?",
                bg: "tracks_bg.jpg",
                choices: [
                    { text: "Изо всех сил пробиваться к чужому желтому огоньку", next: "yellow_light" },
                    { text: "Забиться в узкую расщелину и переждать бурю", next: "crevice_hide" }
                ]
            },
            crevice_hide: {
                title: "Глава III: Укрытие под настом",
                text: "Вы втискиваетесь в ледяной каменный мешок. Снаружи раздается тяжелая поступь. Тень заглядывает внутрь расщелины — два пустых белых провала вместо глаз.",
                bg: "tracks_bg.jpg",
                choices: [
                    { text: "Замереть и надеяться на чудо", next: "crevice_survive" },
                    { text: "Обороняться с ножом наготове", condition: "knife", next: "knife_fight" }
                ]
            },
            knife_fight: {
                title: "Глава III: Удар во тьме",
                text: "Когда холодные когти тянутся внутрь, вы отчаянно бьете наотмашь охотничьим ножом. Лезвие бьется о ледяную плоть, раздается нечеловеческий визг, и тень отступает в метель, оставляя вас в живых до рассвета.",
                bg: "tracks_bg.jpg",
                choices: [
                    { text: "Дождаться утра и выйти к людям", next: "ending_survivor" }
                ]
            },
            crevice_survive: {
                title: "Глава IV: Утро над бездной",
                text: "К рассвету буря утихла. Вы выносите из укрытия обмороженные руки. Внизу чернеет разорванная палатка. Вы один на всем перевале.",
                bg: "tracks_bg.jpg",
                choices: [
                    { text: "Начать тяжелый спуск вниз по долине реки", next: "ending_survivor" },
                    { text: "Подняться к остаткам палатки", next: "ending_diary" }
                ]
            },
            yellow_light: {
                title: "Глава III: Иллюзия тепла",
                text: "Свечение исходит из трещин в самом льду, пульсируя в такт вашему пульсу. Из-за валуна доносится шепот, зовущий вас по имени.",
                bg: "cedar_anomaly_bg.jpg",
                choices: [
                    { text: "Ответить на зов и сделать шаг навстречу сиянию", next: "ending_ice_absorb" },
                    { text: "Развернуться и бежать к кедру", next: "cedar_approach" }
                ]
            },
            cedar_approach: {
                title: "Глава III: Уголевы тропы",
                text: "Вокруг кедра снег спекся в зеркальное стекло. В центре площадки лежит фотоаппарат и следы босых ног, уходящие в вертикальную скалу.",
                bg: "cedar_anomaly_bg.jpg",
                choices: [
                    { text: "Поднять фотоаппарат и заглянуть в видоискатель", next: "ending_camera" },
                    { text: "Попытаться идти по следам наверх", next: "ending_ascension" }
                ]
            },
            // Концовки
            ending_anomaly: {
                title: "Финал: Точка невозврата",
                isEnding: true,
                text: "Прикосновение к обожженной коре кедра отзывается взрывом в сознании. Поисковики найдут тело без признаков насильственной смерти, но с совершенно седыми волосами.",
                endingTitle: "Финал: Пленники сороковой параллели",
                endingDesc: "Гора забрала ваше имя, оставив лишь пустую оболочку во льдах.",
                shareText: "Я разгадал тайну синего света у кедра в триллере «Одна ночь на перевале»!",
                bg: "cedar_anomaly_bg.jpg"
            },
            ending_frozen: {
                title: "Финал: Ледяной саван",
                isEnding: true,
                text: "Попытка вернуться к палатке закончилась на полпути. Метель бережно укутала неподвижное тело.",
                endingTitle: "Финал: Вечный сон на насте",
                endingDesc: "Вы стали частью холодного пейзажа.",
                shareText: "Я замерз на склоне горы М. в жутком квесте «Одна ночь на перевале»!",
                bg: "tracks_bg.jpg"
            },
            ending_survivor: {
                title: "Финал: Дорога сквозь бурю",
                isEnding: true,
                text: "Спустя трое суток вас подобрали геологи. Вы единственный, кто вышел живым из этой роковой ночи.",
                endingTitle: "Финал: Единственный свидетель",
                endingDesc: "Вы выжили, но правда о перевале умрет вместе с вами.",
                shareText: "Я прошел сквозь ад и выжил в триллере «Одна ночь на перевале»!",
                bg: "intro_bg.jpg"
            },
            ending_diary: {
                title: "Финал: Последняя запись",
                isEnding: true,
                text: "Вернувшись к палатке, вы обнаружили чужой дневник со страницей, исписанной вашей собственной рукой о событиях завтрашнего дня.",
                endingTitle: "Финал: Петля времени",
                endingDesc: "Прошлое, настоящее и будущее слились в единый ледяной узел.",
                shareText: "Я попал в временную петлю в квесте «Одна ночь на перевале»!",
                bg: "tent_cut_bg.jpg"
            },
            ending_ice_absorb: {
                title: "Финал: Растворение во льду",
                isEnding: true,
                text: "Шагнув в ледяное свечение, вы обрели бесконечный покой. Теперь вы часть легенды горы.",
                endingTitle: "Финал: Новый страж горы",
                endingDesc: "Вы больше не человек. Вы — холодное сияние.",
                shareText: "Я стал частью тайны горы М. в квесте «Одна ночь на перевале»!",
                bg: "ending_ice_bg.jpg"
            },
            ending_camera: {
                title: "Финал: Последний кадр",
                isEnding: true,
                text: "В объективе отражалось нечто колоссальное. Вспышка памяти оборвала вашу жизнь в ту же секунду.",
                endingTitle: "Финал: Кадр из зазеркалья",
                endingDesc: "Вы увидели то, что видеть не должны.",
                shareText: "Я заглянул в объектив ужаса в квесте «Одна ночь на перевале»!",
                bg: "cedar_anomaly_bg.jpg"
            },
            ending_ascension: {
                title: "Финал: Шаг в белизну",
                isEnding: true,
                text: "Вы пошли по вертикальной стене. Наверху ждал ослепительный, выжигающий сетчатку свет.",
                endingTitle: "Финал: Вознесение в метель",
                endingDesc: "Ваш путь оборвался там, где начинается космос.",
                shareText: "Я ушел по следам в небо в квесте «Одна ночь на перевале»!",
                bg: "ending_ice_bg.jpg"
            }
        };

        let currentState = 'intro';

        function renderGame() {
            const container = document.getElementById('game-container');
            const body = document.getElementById('page-body');
            const data = storyData[currentState];

            if (data.bg) {
                body.style.backgroundImage = `url('${data.bg}')`;
            }

            let html = `<div class="fade-in">`;

            if (data.isEnding) {
                html += `
                    <div class="text-center">
                        <span class="inline-block px-3 py-1 mb-4 text-xs font-semibold tracking-wider text-red-500 uppercase bg-black/70 border border-red-900/80 rounded-full">Архивное дело закрыто</span>
                        <h2 class="text-xl sm:text-2xl font-bold text-red-600 mb-3 font-mono-title">${data.endingTitle}</h2>
                        <p class="text-[#00ff66] text-sm sm:text-base mb-6 leading-relaxed drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">${data.text}</p>
                        <div class="bg-black/80 p-4 rounded-lg border border-red-950/80 mb-8 backdrop-blur-sm">
                            <p class="text-red-400 text-sm italic">${data.endingDesc}</p>
                        </div>
                        <div class="flex flex-col sm:flex-row gap-3 justify-center">
                            <button onclick="restartGame()" class="px-6 py-3 bg-red-700 hover:bg-red-600 text-black font-bold rounded-lg transition-all glow-button uppercase tracking-wider text-xs">
                                Начать заново
                            </button>
                            <button onclick="shareResult('${data.shareText}')" class="px-6 py-3 bg-black/80 hover:bg-black text-[#00ff66] font-semibold rounded-lg transition-all border border-red-800/50 text-xs backdrop-blur-sm">
                                Поделиться результатом
                            </button>
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <h2 class="text-lg sm:text-xl font-bold text-red-600 mb-4 font-mono-title">${data.title}</h2>
                    <p class="text-[#00ff66] text-sm sm:text-base mb-8 leading-relaxed drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">${data.text}</p>
                    <div class="space-y-3">
                `;

                data.choices.forEach(choice => {
                    // Проверка условий скрытых предметов (инвентаря)
                    if (choice.condition && !inventory.includes(choice.condition)) {
                        return; // Пропускаем вариант, если у игрока нет нужного предмета
                    }

                    html += `
                        <button onclick="makeChoice('${choice.next}', '${choice.action || ''}')" class="w-full text-left p-4 rounded-lg bg-black/80 hover:bg-red-950/50 border border-red-950/70 hover:border-red-600 transition-all text-[#00ff66] hover:text-white text-sm sm:text-base flex items-center justify-between group backdrop-blur-sm">
                            <span>${choice.text}</span>
                            <span class="text-red-600 opacity-0 group-hover:opacity-100 transition-opacity ml-2">→</span>
                        </button>
                    `;
                });

                html += `</div>`;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        function makeChoice(nextNode, action) {
            // Обработка подбора предметов на старте
            if (action === 'take_flare_knife') {
                if (!inventory.includes('flare')) inventory.push('flare');
                if (!inventory.includes('knife')) inventory.push('knife');
            } else if (action === 'take_knife') {
                if (!inventory.includes('knife')) inventory.push('knife');
            } else if (action === 'take_medkit') {
                if (!inventory.includes('medkit')) inventory.push('medkit');
            }

            currentState = nextNode;
            renderGame();
        }

        function restartGame() {
            inventory = []; // Сбрасываем инвентарь при перезапуске
            currentState = 'intro';
            renderGame();
        }

        function shareResult(text) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    alert("Результат скопирован в буфер обмена!");
                });
            } else {
                alert(text);
            }
        }

        renderGame();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Одна ночь на перевале — Психологический триллер</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030508;
            color: #cbd5e1;
        }

        h1, h2, h3, .font-mono-title {
            font-family: 'Special Elite', monospace;
        }

        .glow-box {
            box-shadow: 0 0 35px rgba(14, 165, 233, 0.06);
            border: 1px solid rgba(14, 165, 233, 0.15);
        }

        .glow-button:hover {
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.25);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-950 via-[#030508] to-black">

    <!-- Шапка -->
    <header class="w-full py-6 px-4 text-center border-b border-sky-950/60 bg-black/70 backdrop-blur-md">
        <span class="text-xs text-sky-500/70 tracking-widest uppercase font-semibold block mb-1">Секретный архив / Протокол № 19</span>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-wider text-sky-400 font-mono-title drop-shadow-[0_0_12px_rgba(14,165,233,0.25)]">
            Одна ночь на перевале
        </h1>
    </header>

    <!-- Основной контейнер игры -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-6">
        <div id="game-container" class="w-full max-w-xl bg-slate-900/95 backdrop-blur-xl rounded-xl p-6 sm:p-8 glow-box transition-all duration-300">
            <!-- Динамический контент -->
        </div>
    </main>

    <!-- Подвал -->
    <footer class="w-full py-4 text-center text-xs text-slate-600 border-t border-slate-900/80">
        То, что случилось на склоне, навсегда осталось во льдах
    </footer>

    <script>
        const storyData = {
            intro: {
                title: "Шторм у кедра",
                text: "Ветер бьет в брезент палатки с такой яростью, будто массивные стены горы М. хотят стереть вас с лица земли. Температура за бортом рухнула далеко за минус тридцать. Внезапно сквозь грохот бури прорезается низкий, вибрирующий гул. От него закладывает уши, а в груди появляется панический, липкий страх. Секунду спустя брезент озаряет мертвенно-синяя вспышка.",
                choices: [
                    { text: "Срочно резать брезент изнутри ножом и вырываться наружу в метель", next: "tent_cut" },
                    { text: "Попытаться зажечь карманный фонарь и окликнуть товарищей", next: "tent_darkness" }
                ]
            },
            tent_darkness: {
                title: "Вспышка в темноте",
                text: "Щелчок тумблера — и ничего. Фонарь мертв, хотя батареи были заряжены на максимум. В темноте слышно, как тяжело и прерывисто дышат товарищи. Их лица наощупь кажутся ледяными, а на прямой вопрос они не отвечают, лишь бормочут что-то невнятное на непонятном языке. Снаружи раздается металлический скрежет по камню.",
                choices: [
                    { text: "Хватит ждать. Достать нож и кромсать палатку", next: "tent_cut" },
                    { text: "Попытка нащупать рацию и передать сигнал бедствия в центр", next: "tent_radio" }
                ]
            },
            tent_radio: {
                title: "Мертвый эфир",
                text: "Пальцы дрожащими суставами крутят ручку настройки рации. Из динамика доносится лишь сплошной, оглушающий треск статиты, сквозь который пробивается странный ритмичный стук — будто кто-то извне стучит металлом по металлу. Палатка начинает стремительно прогибаться внутрь, словно на нее опустилась невидимая тяжесть.",
                choices: [
                    { text: "Бросить рацию и немедленно резать брезент на выход", next: "tent_cut" }
                ]
            },
            tent_cut: {
                title: "Снежная слепота",
                text: "Вы вываливаетесь из распоротой палатки прямо в лицо ледяной бури. Босые ноги мгновенно теряют чувствительность на жестком насте. В ста метрах ниже по склону, у рафинированного силуэта старого кедра, мерцает пульсирующий шар неестественного синего света. Воздух вокруг гудит от высокого напряжения, во рту чувствуется отчетливый металлический привкус.",
                choices: [
                    { text: "Броситься вниз по склону прямо к таинственному свету у кедра", next: "cedar_approach" },
                    { text: "Отползти в сторону от гребня, попытавшись укрыться в каменном распадке", next: "ravine_hide" }
                ]
            },
            cedar_approach: {
                title: "Притяжение у дерева",
                text: "Вы проваливаетесь в сугровы, подгоняемые невидимым холодом. У кедра нет людей — только оплавленный, спекшийся в стекло снег и странные глубокие борозды, будто здесь протащили многотонную тяжесть. Синий шар исчезает, оставляя после себя жуткую, давящую тишину. Кожа на лице начинает саднить, будто от сильного ожога.",
                choices: [
                    { text: "Осмотреть воронку во льду и прикоснуться к оплавленной коре", next: "ending_anomaly" },
                    { text: "Попытаться карабкаться обратно к палатке за теплыми вещами", next: "ending_frozen" }
                ]
            },
            ravine_hide: {
                title: "Ледяной лог",
                text: "Вы скатываетесь в глубокий овраг, забиваясь под снежный карниз. Буря здесь чуть тише, но мороз пробирает до мозга костей. Вверху, на открытом гребне, проплывают тени. Они движутся не так, как люди — слишком резко, плавно и неестественно быстро. Одна из теней останавливается прямо над вашим укрытием.",
                choices: [
                    { text: "Затаить дыхание и закрыть глаза, молясь, чтобы вас не заметили", next: "ending_silence" },
                    { text: "Резко вскочить и попытаться бежать вверх по течению замерзшего ручья", next: "ending_stream" }
                ]
            },
            ending_anomaly: {
                title: "Финал: Точка невозврата",
                text: "Прикосновение к обожженному дереву отзывается вспышкой боли в сознании. Вы видите то, чего человеческий мозг видеть не должен. Через несколько дней поисковый отряд найдет замерзшую фигуру со странными ожогами на коже. Дело будет засекречено грифом «Секретно».",
                isEnding: true,
                endingTitle: "Финал: Контакт сороковой параллели",
                endingDesc: "Вы стали частью тайны перевала. Ваше имя вычеркнуто из списков живых.",
                shareText: "Я разгадал тайну синего света у кедра в триллере «Одна ночь на перевале»!"
            },
            ending_frozen: {
                title: "Финал: Путь назад закрыт",
                text: "Попытка вернуться к палатке провалилась — силы оставили вас на половине подъема. Ледяной ветер бережно укутывает неподвижное тело в саван из плотного снега. Утром солнце осветит пустой склон и рваный лоскут брезента.",
                isEnding: true,
                endingTitle: "Финал: Ледяной сон",
                endingDesc: "Гора забрала свое. Никто не вернется прежним.",
                shareText: "Я замерз на склоне горы М. в жутком квесте «Одна ночь на перевале»!"
            },
            ending_silence: {
                title: "Финал: Безмолвный свидетель",
                text: "Тень постояла над вашим укрытием и растворилась в вое метели. Вы выжили ту ночь, но холод навсегда поселился внутри. Вы вернулись в цивилизацию седым, молчаливым человеком, который больше никогда не смотрит на ночное небо.",
                isEnding: true,
                endingTitle: "Финал: Выживший в тишине",
                endingDesc: "Вы сохранили жизнь, но потеряли рассудок.",
                shareText: "Я пережил ужас ночи на перевале, но унес страшную тайну с собой!"
            },
            ending_stream: {
                title: "Финал: Погоня в логу",
                text: "Бегство по ручью не спасло. Шаги за спиной приближались с нечеловеческой скоростью. На рассвете в низовьях найдут лишь разорванный штормовой костюм. Гора хранит свои секреты надежнее любых сейфов.",
                isEnding: true,
                endingTitle: "Финал: Погоня без следов",
                endingDesc: "От вас остались только воспоминания и пустой дневник.",
                shareText: "Я попытался убежать от кошмара в квесте «Одна ночь на перевале»!"
            }
        };

        let currentState = 'intro';

        function renderGame() {
            const container = document.getElementById('game-container');
            const data = storyData[currentState];

            let html = `<div class="fade-in">`;

            if (data.isEnding) {
                html += `
                    <div class="text-center">
                        <span class="inline-block px-3 py-1 mb-4 text-xs font-semibold tracking-wider text-sky-400 uppercase bg-sky-950/80 border border-sky-800/60 rounded-full">Протокол закрыт</span>
                        <h2 class="text-2xl sm:text-3xl font-bold text-sky-300 mb-3 font-mono-title">${data.endingTitle}</h2>
                        <p class="text-slate-300 text-sm sm:text-base mb-6 leading-relaxed">${data.text}</p>
                        <div class="bg-black/60 p-4 rounded-lg border border-slate-800 mb-8">
                            <p class="text-sky-200/80 text-sm italic">${data.endingDesc}</p>
                        </div>
                        <div class="flex flex-col sm:flex-row gap-3 justify-center">
                            <button onclick="restartGame()" class="px-6 py-3 bg-sky-600 hover:bg-sky-500 text-slate-950 font-bold rounded-lg transition-all glow-button uppercase tracking-wider text-xs">
                                Начать заново
                            </button>
                            <button onclick="shareResult('${data.shareText}')" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-sky-300 font-semibold rounded-lg transition-all border border-sky-500/30 text-xs">
                                Поделиться результатом
                            </button>
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <h2 class="text-xl sm:text-2xl font-bold text-sky-400 mb-4 font-mono-title">${data.title}</h2>
                    <p class="text-slate-300 text-sm sm:text-base mb-8 leading-relaxed">${data.text}</p>
                    <div class="space-y-3">
                `;

                data.choices.forEach(choice => {
                    html += `
                        <button onclick="makeChoice('${choice.next}')" class="w-full text-left p-4 rounded-lg bg-slate-800/80 hover:bg-sky-950/50 border border-slate-700/80 hover:border-sky-600/60 transition-all text-slate-200 hover:text-sky-200 text-sm sm:text-base flex items-center justify-between group">
                            <span>${choice.text}</span>
                            <span class="text-sky-400 opacity-0 group-hover:opacity-100 transition-opacity ml-2">→</span>
                        </button>
                    `;
                });

                html += `</div>`;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        function makeChoice(nextNode) {
            currentState = nextNode;
            renderGame();
        }

        function restartGame() {
            currentState = 'intro';
            renderGame();
        }

        function shareResult(text) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    alert("Результат скопирован в буфер обмена!");
                });
            } else {
                alert(text);
            }
        }

        renderGame();
    </script>
</body>
</html>
